name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    name: build-test (node24 + postgres18)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_DB: private_chat_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d private_chat_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      INTEGRATION_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/private_chat_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Install video tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Typecheck (strict)
        run: npm run typecheck

      - name: Foundation checks (contracts + infra scripts)
        run: npm run check:foundation

      - name: Backend unit tests
        run: npm run test --workspace @private-chat/api

      - name: Frontend unit tests
        run: npm run test --workspace @private-chat/web

      - name: Backend integration tests (ephemeral postgres service)
        run: npm run test:integration --workspace @private-chat/api
